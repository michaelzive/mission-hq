spring:
  application.name: missionhq
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/missionhq}
    username: ${DB_USER:missionhq}
    password: ${DB_PASSWORD:missionhq}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
missionhq:
  push:
    public-key: ${VAPID_PUBLIC_KEY:}     # generate once: java -cp target/classes com.family.missionhq.push.VapidKeyGen (or npx web-push generate-vapid-keys)
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:dad@example.com}
  cors:
    allowed-origins: ${CORS_ORIGINS:}   # comma-separated, e.g. https://hq.example.pages.dev,https://hq-parent.example.pages.dev
  parent:
    email: ${PARENT_EMAIL:dad@example.com}
    password: ${PARENT_PASSWORD:change-me}
  storage:
    type: ${STORAGE_TYPE:local}          # local | s3
    photo-ttl-days: 30
    signing-secret: ${STORAGE_SECRET:dev-only-change-me}
    local:
      dir: ${STORAGE_DIR:./data/photos}
      public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    s3:                                  # R2: endpoint https://<account>.r2.cloudflarestorage.com, region auto
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:missionhq-photos}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
server.port: 8080
