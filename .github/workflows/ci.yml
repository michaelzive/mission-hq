# Build + test on every push and pull request. Integration tests start Postgres via Testcontainers (Docker is
# available on ubuntu runners), so this exercises the real Flyway migrations including the dev seed profile.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: missionhq-backend/missionhq } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B --no-transfer-progress verify

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: missionhq-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: missionhq-web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run build:dev
